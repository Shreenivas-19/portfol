
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shreenivas Honnalli | Profile</title>

    <style>
        :root {
            --bg: #e2e7ef;
            --light: #ffffff;
            --dark: #b8c1d0;
            --text: #35445b;
            --muted: #8491a5;
            --accent: #617c9f;

            --shadow:
                12px 12px 26px var(--dark),
                -12px -12px 26px var(--light);

            --shadow-small:
                6px 6px 14px var(--dark),
                -6px -6px 14px var(--light);

            --shadow-inset:
                inset 5px 5px 10px var(--dark),
                inset -5px -5px 10px var(--light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: grid;
            place-items: center;

            padding: 40px;
            background: var(--bg);

            font-family:
                Inter, "Segoe UI", system-ui, sans-serif;

            color: var(--text);
        }

        /* Laptop-sized main card */
        .profile-card {
            width: min(100%, 720px);
            padding: 38px;

            border-radius: 30px;
            background: var(--bg);
            box-shadow: var(--shadow);

            animation: appear .65s ease both;

            transition:
                transform .35s ease,
                box-shadow .35s ease;
        }

        .profile-card:hover {
            transform: translateY(-4px);

            box-shadow:
                16px 16px 34px var(--dark),
                -16px -16px 34px var(--light);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;

            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .status::before {
            content: "";
            width: 8px;
            height: 8px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #6aa78a;
        }

        .divider {
            height: 2px;
            margin-bottom: 30px;

            background: linear-gradient(
                90deg,
                transparent,
                #c1cad8,
                #ffffff,
                #c1cad8,
                transparent
            );
        }

        /* Horizontal identity section */
        .identity {
            display: grid;
            grid-template-columns: 130px minmax(0, 1fr);
            align-items: center;
            gap: 30px;

            margin-bottom: 34px;
        }

        .avatar {
            width: 130px;
            aspect-ratio: 1;

            display: grid;
            place-items: center;

            border-radius: 50%;
            background: var(--bg);
            box-shadow: var(--shadow);

            transition: transform .3s ease;
        }

        .avatar-inner {
            width: 96px;
            aspect-ratio: 1;

            display: grid;
            place-items: center;

            border-radius: 50%;
            background: var(--bg);
            box-shadow: var(--shadow-inset);
        }

        .avatar span {
            color: var(--accent);
            font-size: 36px;
            font-weight: 850;
            letter-spacing: -2px;
        }

        .profile-card:hover .avatar {
            transform: scale(1.04);
        }

        h1 {
            font-size: clamp(27px, 3vw, 36px);
            line-height: 1.2;
            letter-spacing: -1.3px;
            overflow-wrap: anywhere;
        }

        .designation {
            display: inline-block;
            margin-top: 14px;
            padding: 9px 18px;

            border-radius: 30px;
            background: var(--bg);
            box-shadow: var(--shadow-inset);

            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .tagline {
            margin-top: 15px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        /* Two-column information grid */
        .details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .detail {
            min-width: 0;
            min-height: 140px;

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 16px;

            padding: 24px;
            border-radius: 22px;

            background: var(--bg);
            box-shadow: var(--shadow-small);

            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .detail:hover {
            transform: translateY(-3px);
            box-shadow:
                3px 3px 8px var(--dark),
                -3px -3px 8px var(--light);
        }

        .detail-icon {
            width: 48px;
            aspect-ratio: 1;

            display: grid;
            place-items: center;

            border-radius: 15px;
            background: var(--bg);
            box-shadow: var(--shadow-inset);

            color: var(--accent);
            font-size: 23px;
        }

        .detail-label {
            margin-bottom: 8px;

            color: var(--muted);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 650;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        /* Interests and footer */
        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;

            margin-top: 30px;
        }

        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chip {
            padding: 11px 17px;
            border-radius: 30px;

            background: var(--bg);
            box-shadow: var(--shadow-small);

            color: var(--accent);
            font-size: 12px;
            font-weight: 750;

            transition:
                box-shadow .25s ease,
                transform .25s ease;
        }

        .chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-inset);
        }

        .footer {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: right;
            white-space: nowrap;
        }

        /* Medium screens and smaller laptops */
        @media (max-width: 700px) {
            body {
                padding: 25px;
            }

            .profile-card {
                padding: 28px;
            }

            .identity {
                grid-template-columns: 100px minmax(0, 1fr);
                gap: 22px;
            }

            .avatar {
                width: 100px;
            }

            .avatar-inner {
                width: 74px;
            }

            .avatar span {
                font-size: 29px;
            }

            h1 {
                font-size: 27px;
            }

            .detail {
                padding: 19px;
            }

            .bottom {
                align-items: flex-start;
                flex-direction: column;
            }

            .footer {
                text-align: left;
            }
        }

        /* Mobile screens */
        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            .profile-card {
                padding: 24px;
                border-radius: 24px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .identity {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 22px;
            }

            .avatar {
                width: 105px;
                margin-inline: auto;
            }

            .avatar-inner {
                width: 78px;
            }

            h1 {
                font-size: 29px;
            }

            .details {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .detail {
                min-height: 0;
            }

            .bottom {
                align-items: center;
            }

            .footer {
                text-align: center;
                white-space: normal;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            .profile-card:hover,
            .avatar,
            .detail:hover,
            .chip:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>

    <main class="profile-card">

        <header class="topbar">
            <span class="eyebrow">Personal Profile</span>
            <span class="status">Digital Identity</span>
        </header>

        <div class="divider"></div>

        <section class="identity">
            <div class="avatar" aria-hidden="true">
                <div class="avatar-inner">
                    <span>SH</span>
                </div>
            </div>

            <div class="identity-text">
                <h1>Shreenivas Honnalli</h1>

                <p class="designation">Lecturer</p>

                <p class="tagline">
                    Curious mind. Logical thinking.
                    Infinite questions.
                </p>
            </div>
        </section>

        <section class="details" aria-label="Profile details">

            <article class="detail">
                <div class="detail-icon" aria-hidden="true">
                    &#9906;
                </div>

                <div>
                    <h2 class="detail-label">Location</h2>
                    <p class="detail-value">Tumkur, Karnataka</p>
                </div>
            </article>

            <article class="detail">
                <div class="detail-icon" aria-hidden="true">
                    &#10022;
                </div>

                <div>
                    <h2 class="detail-label">Interests</h2>
                    <p class="detail-value">
                        Philosophy &amp; Computing
                    </p>
                </div>
            </article>

        </section>

        <footer class="bottom">
            <div class="interests">
                <span class="chip">Philosophy</span>
                <span class="chip">Computing</span>
            </div>

            <p class="footer">THINK DEEP · BUILD SMART</p>
        </footer>

    </main>

</body>
</html>
